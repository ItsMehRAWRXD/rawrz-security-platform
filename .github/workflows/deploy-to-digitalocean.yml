name: Deploy to DigitalOcean

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run basic tests
      run: |
        node rawrz-standalone.js help
        node rawrz-standalone.js sysinfo
    
    - name: Test encryption functionality
      run: |
        echo "test data" > test.txt
        node rawrz-standalone.js encrypt aes256 test.txt .enc
        ls -la encrypted_*
        rm -f test.txt encrypted_*

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Deploy to DigitalOcean App Platform
      uses: digitalocean/app_action@v1.1.5
      with:
        app_name: rawrz-security-platform
        token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        
    # Alternative: Deploy using doctl CLI
    - name: Install doctl
      uses: digitalocean/action-doctl@v2
      with:
        token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        
    - name: Update DigitalOcean App
      run: |
        # Create or update the app
        doctl apps create --spec .do/app.yaml || doctl apps update ${{ secrets.DO_APP_ID }} --spec .do/app.yaml