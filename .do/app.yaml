name: rawrz-security-platform
services:
- name: rawrz-app
  source_dir: /
  github:
    repo: your-username/rawrz-security-platform
    branch: main
  run_command: node rawrz-standalone.js help
  environment_slug: node-js
  instance_count: 1
  instance_size_slug: basic-xxs
  routes:
  - path: /
  health_check:
    http_path: /health
    initial_delay_seconds: 30
    period_seconds: 10
    timeout_seconds: 5
    success_threshold: 1
    failure_threshold: 3
  envs:
  - key: NODE_ENV
    value: production
  - key: LOG_LEVEL
    value: info
  - key: PORT
    value: "8080"
    type: SECRET
    scope: RUN_TIME

