name: rawrz-security-platform
services:
- name: rawrz-web-app
  source_dir: /
  github:
    repo: ItsMehRAWRXD/rawrz-security-platform
    branch: main
  run_command: npm start
  environment_slug: node-js
  instance_count: 1
  instance_size_slug: basic-xxs
  http_port: 8080
  routes:
  - path: /
  - path: /panel
  - path: /api
  health_check:
    http_path: /api/health
    initial_delay_seconds: 30
    period_seconds: 10
    timeout_seconds: 5
    success_threshold: 1
    failure_threshold: 3
  envs:
  - key: NODE_ENV
    value: production
  - key: LOG_LEVEL
    value: info
  - key: PORT
    value: "8080"
  - key: CORS_ORIGIN
    value: "*"
  - key: MAX_FILE_SIZE
    value: "100MB"

